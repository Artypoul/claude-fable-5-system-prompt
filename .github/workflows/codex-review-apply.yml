name: Apply reviewed Codex port once

on:
  push:
    branches: [codex/adapt-fable5-skill]
    paths: [.github/workflows/codex-review-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Artypoul/claude-fable-5-system-prompt' && github.ref == 'refs/heads/codex/adapt-fable5-skill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/adapt-fable5-skill
          fetch-depth: 0
      - name: Reconstruct the hash-pinned reviewed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.request

          expected_base = '0cbf368df2324f170d72d6aaf0750016b5304642'
          expected_digest = 'fc00064be5ff781fb19ba6e0758206905a30039a09f6907271cb1dbf01349be0'
          parts = [
              '059e618ee0e2fea14a5663f8866a2dcedca4763e',
              '08f23f816fa87839410bd5eb51ed3db0e248881c',
              '0f8e363ab81a5ed8f1e1ba4a7a183aa41a27e1be',
              '8d01dfba4cc111828ebf4e6d6b57efc914ea5573',
              '96c0aea921e96a4894b1fe3fe7a09e6a57296720',
              'a3fd3fbd6feab599ee824c44ab347a902db838d9',
              'af1f724a3292220b1eec0dc632e26983453b59f5',
          ]
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'Artypoul/claude-fable-5-system-prompt':
              raise SystemExit('Unexpected repository')
          chunks = []
          for sha in parts:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                           'Accept': 'application/vnd.github+json',
                           'User-Agent': 'codex-source-port-review'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              if blob.get('encoding') != 'base64' or blob.get('sha') != sha:
                  raise SystemExit('Unexpected blob response')
              chunk = base64.b64decode(blob['content'])
              git_digest = hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest()
              if git_digest != sha:
                  raise SystemExit('Blob content integrity failure')
              chunks.append(chunk)
          archive = b''.join(chunks)
          if hashlib.sha256(archive).hexdigest() != expected_digest:
              raise SystemExit('Reviewed payload digest mismatch')
          payload = json.loads(lzma.decompress(archive))
          if payload['base'] != expected_base:
              raise SystemExit('Unexpected review baseline')
          allowed = {
              '.agents/skills/fable5-codex/SKILL.md',
              '.agents/skills/fable5-codex/references/engineering-workflow.md',
              '.agents/skills/fable5-codex/references/mcp-consent-and-connectors.md',
              '.agents/skills/fable5-codex/references/research-and-citations.md',
              '.agents/skills/fable5-codex/references/search-policy.md',
              '.agents/skills/fable5-codex/references/source-faithful-port.md',
              'README.md', 'scripts/verify_codex_skill.py', 'tests/test_codex_port.py',
          }
          workflow = '.github/workflows/codex-skill-validation.yml'
          files = payload['files']
          if set(files) != allowed | {workflow}:
              raise SystemExit('Unexpected reviewed paths')
          # Workflow updates remain a separate connector-authorized write.
          files.pop(workflow)
          report_path = 'CODEX_ADAPTATION_CHANGES.md'
          targets = sorted(allowed | {report_path})
          subprocess.run(['git', 'diff', '--exit-code', expected_base, 'HEAD', '--', *targets], check=True)
          port = files['.agents/skills/fable5-codex/references/source-faithful-port.md']
          matches = list(re.finditer(r'^<a id="([^"]+)"></a>\s*$', port, re.M))
          bodies = {m.group(1): port[m.end():matches[i+1].start() if i+1 < len(matches) else len(port)].strip()
                    for i, m in enumerate(matches)}
          if len(payload['rows']) != 538:
              raise SystemExit('Unexpected source coverage row count')
          report = payload['prefix']
          for row in payload['rows']:
              if len(row) != 5 or row[4] not in bodies:
                  raise SystemExit('Invalid source ledger target')
              digest = hashlib.sha256(bodies[row[4]].encode()).hexdigest()
              report += '| ' + ' | '.join(row + [digest]) + ' |\n'
          if hashlib.sha256(report.encode()).hexdigest() != payload['report_sha256']:
              raise SystemExit('Reconstructed report does not match reviewed bytes')
          files[report_path] = report
          root = Path.cwd().resolve()
          for name, content in files.items():
              destination = root / name
              if destination.is_symlink() or not destination.resolve().is_relative_to(root):
                  raise SystemExit('Unsafe target path')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(content, encoding='utf-8', newline='\n')
          evidence = Path(os.environ['RUNNER_TEMP']) / 'codex-review-apply'
          evidence.mkdir()
          (evidence / 'paths.txt').write_text('\n'.join(targets) + '\n')
          print(f'Reconstructed {len(files)} reviewed files with verified payload and report digests')
          PY
      - name: Run actual validation and regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify_codex_skill.py tests/test_codex_port.py
          python3 scripts/verify_codex_skill.py | tee "$RUNNER_TEMP/codex-review-apply/validator.txt"
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/codex-review-apply/tests.txt"
          python3 scripts/verify_signatures.py | tee "$RUNNER_TEMP/codex-review-apply/attribution.txt"
          git diff --exit-code 9b00248c2f0dd60c12a718853580a5ec44a9edf0 -- system-prompt highlights LICENSE CONTRIBUTING.md scripts/verify_signatures.py
          git diff --check 9b00248c2f0dd60c12a718853580a5ec44a9edf0
      - name: Commit only the reviewed documentation and tests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t paths < "$RUNNER_TEMP/codex-review-apply/paths.txt"
          git add -- "${paths[@]}"
          git diff --cached --check
          git commit -m 'fix: preserve original Fable structure and body-level traceability'
          git push origin HEAD:codex/adapt-fable5-skill
          git rev-parse HEAD > "$RUNNER_TEMP/codex-review-apply/head.txt"
          git archive HEAD -o "$RUNNER_TEMP/codex-review-apply/source.tar"
      - name: Save exact reviewed source and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-reviewed-source
          path: ${{ runner.temp }}/codex-review-apply/
          if-no-files-found: warn
          retention-days: 7
